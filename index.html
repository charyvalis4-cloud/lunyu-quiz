document.querySelectorAll('.opt').forEach(x=>{if(x.textContent==d[2])x.classList.add('ok')});
if(ok)s++;else{b.classList.add('no');w.push(d)}
$('sc').textContent=s;$('ex').innerHTML='<b>'+(ok?'✔ 答對了！':'✘ 正解：'+d[2])+'</b><br>'+d[6];$('ex').style.display='block';
$('hint').classList.add('hide');$('nx').textContent=k+1<Q.length?'下一題':'看成績';$('nx').classList.remove('hide')}
$('hint').onclick=()=>{$('ex').innerHTML='💡 本題出自《論語・'+Q[k][0]+'》，回想原文語境再作答。';$('ex').style.display='block'};
$('nx').onclick=()=>{if(++k<Q.length)show();else finish()};
function finish(){clearInterval(tim);$('play').classList.add('hide');$('end').classList.remove('hide');
const p=Math.round(s/Q.length*100);$('rt').textContent=p+' 分';$('rs').textContent=$('nk').value+'（'+$('gr').value+'）答對 '+s+' / '+Q.length+' 題，用時 '+$('tm').textContent;
const st={};Q.forEach(d=>st[d[0]]=st[d[0]]||[0,0]);Q.forEach(d=>st[d[0]][1]++);Q.forEach(d=>{if(!w.includes(d))st[d[0]][0]++});
$('rd').innerHTML=Object.entries(st).map(([n,[a,b]])=>'<div class="rb"><span>'+n+'</span><div class="bar"><i style="width:'+a/b*100+'%"></i></div><span>'+a+'/'+b+'</span></div>').join('');
$('wr').innerHTML=w.length?w.map(d=>'<p><span class="tag">'+d[0]+'</span><br>'+d[1]+'<br><b>答案：'+d[2]+'</b><br><small>'+d[6]+'</small></p>').join(''):'全部答對，太棒了！';
$('co').textContent=p>=90?'表現優異！可以挑戰其他範圍，或試著默寫重要章句。':p>=70?'基礎不錯，把錯題的原文再讀一遍，印象會更深。':'別灰心，先回到原文與白話解，邊讀邊理解，再來一次。'}
$('again').onclick=()=>{$('end').classList.add('hide');$('home').classList.remove('hide')};
</script></body></html>
